<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXIT AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .tagline {
      color: #666;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .upload-box {
      border: 2px dashed #aaa;
      border-radius: 18px;
      padding: 30px 15px;
      margin-bottom: 18px;
    }

    .upload-icon {
      font-size: 45px;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      margin-top: 15px;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 14px;
      resize: none;
      font-size: 15px;
      outline: none;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 15px;
      background: #f0f2f5;
      text-align: left;
    }

    #result h3 {
      margin-bottom: 8px;
    }

    #result p {
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">FIXIT AI</div>

    <div class="tagline">
      Upload a photo and discover what might be wrong.
    </div>

    <div class="upload-box">
      <div class="upload-icon">📷</div>
      <strong>Upload a Photo</strong>

      <input
        type="file"
        id="photo"
        accept="image/*"
      >
    </div>

    <textarea
      id="problem"
      placeholder="Describe your problem here..."
    ></textarea>

    <button onclick="analyzeProblem()">
      🔍 Analyze Problem
    </button>

    <div id="result">
      <h3>FIXIT AI Result</h3>
      <p id="resultText"></p>
    </div>

  </div>

  <script>
    function analyzeProblem() {
      const problem =
        document.getElementById("problem").value.trim();

      const photo =
        document.getElementById("photo").files.length;

      const result =
        document.getElementById("result");

      const resultText =
        document.getElementById("resultText");

      if (!photo && !problem) {
        alert("Please upload a photo or describe your problem.");
        return;
      }

      result.style.display = "block";

      resultText.innerText =
        "Your problem has been received. FIXIT AI will analyze it and provide possible solutions in the next development stage.";
    }
  </script>

</body>
</html>
